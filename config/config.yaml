ref:
  fasta: "ref/hs37d5.fa"
  genome_file: "defaults/hg19.genome"
  build: "GRCh37"

paths:
  vcf_list: "input/vcfs.txt"
  output_folder: "results/hardnormly"
  log_subdir: "logs"

regions:
  include_beds:
    - "ref/target_files/agilent/S07604514/hg19/S07604514_Regions_hg19_valid_nochr.bed"
    - "ref/target_files/idt/hg19/IDT_xGen_Research_Targets_V1_hg19_nochr.bed"
  exclude_beds:
    - "ref/exclude_files/dukeExcludeRegions.bed"
    - "ref/exclude_files/consensusBlacklist.bed"
  slop: 100

filtering:
  filters_file: "defaults/gatk_filters.txt"
  only_pass: false

processing:
  generate_stats: true
  auto_index: true
  plot_stats: false
